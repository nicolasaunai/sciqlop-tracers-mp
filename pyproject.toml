[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sciqlop-tracers-mp"
version = "0.1.0"
description = "SciQLop plugin: TRACERS magnetic footprint on the T96 magnetopause (live bar + pins)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Aunai" }]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "speasy", "geopack"]

[project.entry-points."sciqlop.plugins"]
sciqlop_tracers_mp = "sciqlop_tracers_mp.plugin"

[tool.hatch.build.targets.wheel]
packages = ["sciqlop_tracers_mp"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "sciqlop_tracers_mp/**/*.py" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access to SSCWeb / CDAWeb through speasy"]
filterwarnings = [
    "error::RuntimeWarning",
    # environment (later entries win): netCDF4 wheel built against another numpy ABI, raised when speasy is imported
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]
